name: OpenWrt Builder V2

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12

  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config

  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  UPLOAD_RELEASE: true

  TZ: Asia/Shanghai
  CCACHE_SIZE: 4G


jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write


    steps:

    - name: Checkout
      uses: actions/checkout@v5


    - name: Free Disk Space
      run: |
        echo "Cleaning runner disk..."

        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/.rustup

        sudo docker image prune -af

        df -h



    - name: Install Build Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive

      run: |

        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          gcc \
          g++ \
          git \
          curl \
          wget \
          rsync \
          unzip \
          ccache \
          python3 \
          python3-pip \
          python3-ply \
          python3-docutils \
          flex \
          bison \
          gawk \
          gettext \
          patch \
          pkgconf \
          cmake \
          ninja-build \
          libncurses-dev \
          zlib1g-dev \
          libssl-dev \
          libelf-dev \
          qemu-utils \
          squashfs-tools \
          zstd

        sudo apt-get clean



    - name: Restore ccache

      uses: actions/cache@v5

      with:

        path: ~/.ccache

        key: |
          ${{ runner.os }}-ccache-${{ env.REPO_BRANCH }}

        restore-keys: |
          ${{ runner.os }}-ccache-



    - name: Configure ccache

      run: |

        mkdir -p ~/.ccache

        ccache -M $CCACHE_SIZE

        ccache -z

        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV



    - name: Prepare Work Directory

      run: |

        sudo mkdir -p /workdir

        sudo chown $USER:$GROUPS /workdir



    - name: Clone OpenWrt Source

      working-directory: /workdir

      run: |

        git clone \
          --depth=1 \
          -b $REPO_BRANCH \
          $REPO_URL \
          openwrt


        cd openwrt

        echo "OpenWrt commit:"
        git log -1 --oneline



    - name: Restore OpenWrt dl Cache

      uses: actions/cache@v5

      with:

        path: /workdir/openwrt/dl

        key: |
          ${{ runner.os }}-dl-${{ hashFiles('feeds.conf.default') }}

        restore-keys: |
          ${{ runner.os }}-dl-

        restore-keys: |
          ${{ runner.os }}-dl-


    - name: Prepare Feeds Configuration

      run: |

        cd /workdir/openwrt


        if [ -f "$GITHUB_WORKSPACE/$FEEDS_CONF" ]; then

          echo "Using custom feeds.conf.default"

          cp \
            "$GITHUB_WORKSPACE/$FEEDS_CONF" \
            feeds.conf.default

        fi



    - name: Update Feeds

      run: |

        cd /workdir/openwrt


        echo "::group::Updating feeds"

        ./scripts/feeds update -a

        echo "::endgroup::"



    - name: Apply DIY Part1

      run: |

        if [ -f "$DIY_P1_SH" ]; then

          chmod +x "$DIY_P1_SH"

          echo "Running DIY Part1"

          ./"$DIY_P1_SH"

        else

          echo "No DIY Part1 script"

        fi



    - name: Apply OpenWrt 25.12 Compatibility Patch

      run: |

        cd /workdir/openwrt


        echo "::group::Applying patches"


        rm -rf /tmp/openwrt-packages


        git clone \
          --depth=1 \
          https://github.com/openwrt/packages.git \
          /tmp/openwrt-packages || true



        if [ -d /tmp/openwrt-packages/lang/golang ]; then

          rm -rf feeds/packages/lang/golang

          cp -r \
            /tmp/openwrt-packages/lang/golang \
            feeds/packages/lang/

          echo "Updated golang"

        fi



        if [ -d /tmp/openwrt-packages/lang/rust ]; then

          rm -rf feeds/packages/lang/rust

          cp -r \
            /tmp/openwrt-packages/lang/rust \
            feeds/packages/lang/

          echo "Updated rust"

        fi



        if [ -f feeds/packages/lang/rust/Makefile ]; then

          sed -i \
          's/--set=llvm\.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' \
          feeds/packages/lang/rust/Makefile || true


          echo "Rust patch applied"

        fi


        rm -rf /tmp/openwrt-packages


        echo "::endgroup::"



    - name: Install Feeds

      run: |

        cd /workdir/openwrt


        echo "::group::Installing feeds"


        ./scripts/feeds install -a


        echo "::endgroup::"



    - name: Load Custom Files And Config

      run: |

        cd /workdir/openwrt



        if [ -d "$GITHUB_WORKSPACE/files" ]; then

          echo "Copying custom files"

          cp -r \
            "$GITHUB_WORKSPACE/files" \
            .

        fi



        if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then

          echo "Loading custom .config"

          cp \
            "$GITHUB_WORKSPACE/$CONFIG_FILE" \
            .config

        else

          echo "No config found, creating default x86_64 config"


          cat > .config << EOF

CONFIG_TARGET_x86=y
CONFIG_TARGET_x86_64=y
CONFIG_TARGET_x86_64_DEVICE_generic=y

EOF

        fi



        if [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ]; then

          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"

          "$GITHUB_WORKSPACE/$DIY_P2_SH"

        fi



        make defconfig



    - name: Download Packages

      run: |

        cd /workdir/openwrt


        echo "::group::Downloading packages"



        for retry in 1 2 3

        do

          echo "Download attempt $retry"


          if make download \
            -j$(nproc) \
            V=s

          then

            break

          fi


          sleep 10


        done



        find dl \
          -size -1024c \
          -delete



        echo "::endgroup::"

        echo "::endgroup::"



    - name: Compile Firmware

      id: compile

      run: |

        cd /workdir/openwrt


        echo "::group::Building firmware"


        export CC="ccache gcc"

        export CXX="ccache g++"



        START_TIME=$(date +%s)



        if make -j$(nproc); then

          echo "Build success"

        else

          echo "Parallel build failed, retry verbose mode"

          make -j1 V=s

        fi



        END_TIME=$(date +%s)

        BUILD_TIME=$((END_TIME-START_TIME))


        echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT


        echo "status=success" >> $GITHUB_OUTPUT



        grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' \
          > DEVICE_NAME || true



        if [ -s DEVICE_NAME ]; then

          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV

        else

          echo "DEVICE_NAME=_generic" >> $GITHUB_ENV

        fi



        echo "FILE_DATE=_$(date +%Y%m%d%H%M)" >> $GITHUB_ENV



        echo "::endgroup::"




    - name: Build Summary

      if: always()

      run: |

        echo "# OpenWrt Build Summary" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY


        echo "## Build Information" >> $GITHUB_STEP_SUMMARY

        echo "- Branch: $REPO_BRANCH" >> $GITHUB_STEP_SUMMARY

        echo "- Repository: $REPO_URL" >> $GITHUB_STEP_SUMMARY


        echo "" >> $GITHUB_STEP_SUMMARY

        echo "## Runner Information" >> $GITHUB_STEP_SUMMARY


        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

        uname -a >> $GITHUB_STEP_SUMMARY

        df -h >> $GITHUB_STEP_SUMMARY

        ccache -s >> $GITHUB_STEP_SUMMARY || true

        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY




    - name: Prepare Firmware

      id: firmware

      if: steps.compile.outputs.status == 'success'

      run: |

        mkdir -p firmware_output



        cd /workdir/openwrt/bin/targets/*/* || exit 1



        rm -rf packages



        cp -r * \
          $GITHUB_WORKSPACE/firmware_output/



        cd $GITHUB_WORKSPACE



        sha256sum firmware_output/* \
          > firmware_output/sha256sums.txt || true



        echo "FIRMWARE_PATH=$GITHUB_WORKSPACE/firmware_output" >> $GITHUB_ENV


        echo "status=success" >> $GITHUB_OUTPUT



    - name: Upload Firmware Artifact

      if: steps.firmware.outputs.status == 'success'

      uses: actions/upload-artifact@v5

      with:

        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}

        path: ${{ env.FIRMWARE_PATH }}

        retention-days: 5

        compression-level: 0




    - name: Generate Release Notes

      if: env.UPLOAD_RELEASE == 'true'

      run: |

        cat > release.txt << EOF

# OpenWrt Firmware Build


## Information

- Branch: $REPO_BRANCH

- Repository: $REPO_URL

- Device: ${{ env.DEVICE_NAME }}

- Build Time: $(date)



## Files

Firmware files and SHA256 checksums are included.


EOF




    - name: Create Release

      if: env.UPLOAD_RELEASE == 'true'

      uses: softprops/action-gh-release@v2

      with:

        tag_name: OpenWrt-${{ github.run_number }}

        name: OpenWrt Build ${{ github.run_number }}

        body_path: release.txt

        files: |

          firmware_output/*


      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}




    - name: Cleanup Old Workflow Runs

      uses: Mattraks/delete-workflow-runs@v2

      with:

        retain_days: 7

        keep_minimum_runs: 3
